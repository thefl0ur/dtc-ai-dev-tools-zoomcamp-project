version: '3.8'

services:
  # Production-like frontend service
  frontend:
    build:
      context: ./frontend
      target: production  # Use production stage
      args:
        - VUE_APP_API_URL=http://backend:8000  # Build-time environment variable
    ports:
      - "3001:80"  # Expose on port 80 (standard HTTP)
    depends_on:
      - backend
    environment:
      - VUE_APP_API_URL=http://backend:8000  # Runtime environment variable for nginx
    networks:
      - vsacia-network

  backend:
    build: ./backend
    ports:
      - "8001:8000"  # Container port 8000 mapped to host port 8001
    environment:
      - MONGODB_URL=mongodb://mongo:27017/vsacia
    depends_on:
      - mongo
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000  # Disable reload for production
    networks:
      - vsacia-network

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - vsacia-network

volumes:
  mongo_data:

networks:
  vsacia-network:
    driver: bridge