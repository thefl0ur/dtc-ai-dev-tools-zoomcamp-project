version: '3.8'

services:
  # Development services with hot reloading
  frontend:
    build:
      context: ./frontend
      target: development  # Use development stage if multi-stage
    ports:
      - "3001:3000"  # Vite default port (mapped to 3001 to avoid conflicts)
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Don't mount node_modules to avoid conflicts
    working_dir: /app
    command: npm run dev
    depends_on:
      - backend
    environment:
      - VUE_APP_API_URL=http://backend:8000
    networks:
      - vsacia-network

  backend:
    build: ./backend
    ports:
      - "8001:8000"  # Container port 8000 mapped to host port 8001
    environment:
      - MONGODB_URL=mongodb://mongo:27017/vsacia
    depends_on:
      - mongo
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload  # Enable auto-reload
    networks:
      - vsacia-network

  mongo:
    image: mongo:6.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - vsacia-network

volumes:
  mongo_data:

networks:
  vsacia-network:
    driver: bridge