name: Manual Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Target environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
      deploy_backend:
        description: 'Deploy backend service?'
        required: true
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy frontend service?'
        required: true
        type: boolean
        default: true
      backend_api_url:
        description: 'Backend API URL for frontend to connect to (e.g., https://your-backend.onrender.com)'
        required: true
        default: 'https://your-backend-url-here'
      custom_tag:
        description: 'Custom Docker image tag (optional)'
        required: false
        type: string

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dtc-ai-dev-tools

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata for backend
        id: backend-meta
        uses: docker/metadata-action@v5
        if: ${{ inputs.deploy_backend == true }}
        with:
          images: ${{ vars.BACKEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value=${{ inputs.custom_tag }}

      - name: Extract metadata for frontend
        id: frontend-meta
        uses: docker/metadata-action@v5
        if: ${{ inputs.deploy_frontend == true }}
        with:
          images: ${{ vars.FRONTEND_IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=
            type=raw,value=${{ inputs.custom_tag }}

      - name: Build and push backend
        uses: docker/build-push-action@v5
        if: ${{ inputs.deploy_backend == true }}
        with:
          context: ./backend
          push: true
          tags: ${{ steps.backend-meta.outputs.tags }}
          labels: ${{ steps.backend-meta.outputs.labels }}

      - name: Build and push frontend
        uses: docker/build-push-action@v5
        if: ${{ inputs.deploy_frontend == true }}
        with:
          context: ./frontend
          push: true
          tags: ${{ steps.frontend-meta.outputs.tags }}
          labels: ${{ steps.frontend-meta.outputs.labels }}

      - name: Deploy to Render - Backend
        if: ${{ inputs.deploy_backend == true }}
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_BACKEND_HOOK }}
        continue-on-error: true

      - name: Deploy to Render - Frontend
        if: ${{ inputs.deploy_frontend == true }}
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_FRONTEND_HOOK }}
        continue-on-error: true

      - name: Deploy to production environment
        run: |
          echo "Production deployment completed!"
          echo "Backend deployed: ${{ inputs.deploy_backend }}"
          echo "Frontend deployed: ${{ inputs.deploy_frontend }}"
          echo "Custom tag used: ${{ inputs.custom_tag }}"