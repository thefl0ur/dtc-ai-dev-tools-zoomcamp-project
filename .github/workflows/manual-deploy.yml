name: Manual Deployment Pipeline

on:
  workflow_dispatch:
    inputs:
      deploy_backend:
        description: 'Deploy backend service?'
        required: true
        type: boolean
        default: true
      deploy_frontend:
        description: 'Deploy frontend service?'
        required: true
        type: boolean
        default: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dtc-ai-dev-tools

    steps:
      - name: Deploy to Render - Backend
        if: ${{ inputs.deploy_backend == true }}
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_BACKEND_HOOK }}

      - name: Trigger frontend deployment to Render
        if: ${{ inputs.deploy_frontend == true }}
        run: |
          curl -X POST ${{ secrets.RENDER_DEPLOY_FRONTEND_HOOK }}

      - name: Deployment completed
        run: |
          echo "Deployment completed!"
          echo "Backend deployed: ${{ inputs.deploy_backend }}"
          echo "Frontend deployment triggered: ${{ inputs.deploy_frontend }}"